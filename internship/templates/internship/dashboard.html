{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>User Dashboard - Vel Tech Internship Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(135deg, #d7d7d7, #f4f4f4);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .dashboard-card {
      background: white;
      border-radius: 15px;
      padding: 40px;
      width: 90%;
      max-width: 800px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
      text-align: center;
    }

    .dashboard-card h2 {
      font-size: 24px;
      margin-bottom: 20px;
    }

    .user-info {
      font-size: 16px;
      margin-bottom: 30px;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 15px;
      align-items: center;
    }

    .actions a {
      display: block;
      text-decoration: none;
      padding: 12px 20px;
      border-radius: 8px;
      background: #007bff;
      color: white;
      font-weight: 500;
      transition: background 0.3s;
      width: 200px;
      text-align: center;
    }

    .actions a:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>
  <div class="dashboard-card">
    <h2>Welcome, {{ user.get_full_name|default:user.username }}</h2>
    <div class="user-info">
      <p><strong>Email:</strong> {{ user.email }}</p>
    </div>
    <div class="actions">
      <a href="{% url 'account_logout' %}">Sign Out</a>
    </div>
  </div>
</body>
</html>
