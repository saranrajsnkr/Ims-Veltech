{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="dashboard-container">
  <div class="dashboard-card">
    <h2>Welcome, {{ user.get_full_name|default:user.username }}</h2>
    <div class="user-info">
      <p><strong>Email:</strong> {{ user.email }}</p>
    </div>
<div class="actions">
  <a href="{% url 'account_logout' %}" 
     id="logout-btn"
     style="display:inline-block;
            padding:12px 28px;
            background:#007bff;
            color:#fff;
            border-radius:10px;
            text-decoration:none;
            font-weight:500;
            transition:background 0.3s ease, transform 0.2s ease;"
     onmouseover="this.style.background='#0056b3'; this.style.transform='scale(1.05)';"
     onmouseout="this.style.background='#007bff'; this.style.transform='scale(1)';">
     Sign Out
  </a>
</div>

  </div>
</div>
{% endblock %}

{% block extra_css %}
<style>
  .dashboard-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: calc(100vh - 60px); /* Adjust if navbar height differs */
    background: linear-gradient(135deg, #eef1f5, #ffffff);
    padding: 20px;
  }

  .dashboard-card {
    background: #fff;
    border-radius: 16px;
    padding: 40px;
    width: 100%;
    max-width: 700px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    text-align: center;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  .dashboard-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
  }

  .dashboard-card h2 {
    font-size: 1.8rem;
    font-weight: 600;
    margin-bottom: 1rem;
    color: #222;
  }

  .user-info {
    font-size: 1rem;
    margin-bottom: 2rem;
    color: #555;
  }

  #logout-btn {
    display: inline-block;
    padding: 12px 28px;
    background: #007bff;
    color: #fff;
    border-radius: 10px;
    text-decoration: none;
    font-weight: 500;
    transition: background 0.3s ease, transform 0.2s ease;
  }

  #logout-btn:hover {
    background: #0056b3;
    transform: scale(1.05);
  }
</style>
{% endblock %}
