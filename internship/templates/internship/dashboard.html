{% load static %}

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Dashboard - Vel Tech Internship Portal</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <!-- OG META COMPONENTS -->
    <meta name="theme-color" content="#ffffff" id="theme-color-meta" />
    <meta
      name="description"
      content="The Veltech Internship Portal is an online platform created to help students apply for internship opportunities offered through the college. Students can easily view available companies and submit their applications by entering basic details like name, roll number, and email.

This portal ensures a simple and organized way for students to apply for internships directly from the college."
    />
    <meta property="og:title" content="Vel Tech Internship Portal" />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://internship-portal-i31y.onrender.com/"
    />
    <meta
      property="og:image"
      content="https://res.cloudinary.com/dvmocwdnn/image/upload/v1751663804/VELTECH_OG_CARD_1_mliesn.jpg"
    />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:description"
      content="The Vel Tech Internship Portal is an online platform created to help students apply for internship opportunities offered through the college. Students can easily view available companies and submit their applications by entering basic details like name, roll number, and email."
    />

    <link
      rel="icon"
      type="image/x-icon"
      href="{% static 'images/LOGO.png' %}"
    />

    <style>
      body {
        font-family: "Roboto", sans-serif;
        background: linear-gradient(135deg, #d7d7d7, #f4f4f4);
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .dashboard-card {
        background: white;
        border-radius: 15px;
        padding: 40px;
        width: 90%;
        max-width: 800px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        text-align: center;
      }

      .dashboard-card h2 {
        font-size: 24px;
        margin-bottom: 20px;
      }

      .user-info {
        font-size: 16px;
        margin-bottom: 30px;
      }

      .actions {
        display: flex;
        flex-direction: column;
        gap: 15px;
        align-items: center;
      }

      .actions a {
        display: block;
        text-decoration: none;
        padding: 12px 20px;
        border-radius: 8px;
        background: #007bff;
        color: white;
        font-weight: 500;
        transition: background 0.3s;
        width: 200px;
        text-align: center;
      }

      .actions a:hover {
        background: #0056b3;
      }
    </style>
  </head>
  <body>
    <div class="dashboard-card">
      <h2>Welcome, {{ user.get_full_name|default:user.username }}</h2>
      <div class="user-info">
        <p><strong>Email:</strong> {{ user.email }}</p>
      </div>
      <div class="actions">
        <a href="{% url 'account_logout' %}">Sign Out</a>
      </div>
    </div>
  </body>
</html>
