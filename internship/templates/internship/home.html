<!DOCTYPE html>
<html>
<head>
  <title>Welcome to Veltech Internship Portal</title>
  <style>
    /* General Page Styling */
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #f5f7fa, #c3cfe2);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    /* Welcome Text */
    p {
      font-size: 20px;
      font-weight: bold;
      color: #333;
      margin-bottom: 20px;
    }

    /* Form */
    form {
      margin: 10px 0;
    }

    /* Buttons */
    button {
      background-color: #ff6600;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background-color: #e65c00;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  {% if user.is_authenticated %}
    <p>Welcome, {{ user.email }}!</p>
    <form action="{% url 'account_logout' %}" method="post">
      {% csrf_token %}
      <button type="submit">Logout</button>
    </form>
  {% else %}
    <form action="{% provider_login_url 'google' %}" method="post">
      {% csrf_token %}
      <button type="submit">Sign in with Google (Veltech Email Only)</button>
    </form>
  {% endif %}
</body>
</html>
